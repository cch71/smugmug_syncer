# cargo-release configuration: https://github.com/crate-ci/cargo-release
#
#   cargo release patch            # dry run: shows what would happen
#   cargo release patch --execute  # bump, commit, tag vX.Y.Z and push
#
# Pushing the tag starts .github/workflows/release.yml, which builds the Linux and macOS
# binaries and publishes the GitHub release.  Nothing is published to crates.io
# (`publish = false` here and in Cargo.toml).
allow-branch = ["main"]
publish = false
push = true
push-remote = "origin"
tag = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: (.*)/compare/.*\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/v{{version}}...HEAD\n[{{version}}]: $1/releases/tag/v{{version}}", exactly = 1 },
]
