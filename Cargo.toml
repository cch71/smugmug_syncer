[package]
name = "smugmug_syncer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "smugmug-syncer"
path = "src/main.rs"

[dependencies]
smugmug = "0.10"
url = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15"
md5 = "0.8.1"
tree-ds = { version = "0.2", features = [
    "serde",
    "async",
    "compact_serde",
    "print_node_id",
] }
log = "0.4"
env_logger = "0.11"
zstd = "0.14"
clap = { version = "4", features = ["derive"] }
clap_derive = "4"
humansize = "2"
image = "0.25"
cxx = "1"
ciborium = { version = "0.2" }
polars = { version = "0.55.2", features = [
    "parquet",
    "json",
    "lazy",
    "serde",
    "serde-lazy",
    "temporal",
    "streaming",
    "performant",
    "object",
    "is_in",
] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"
